<style>
  @font-face{font-family:"Tanker";src:url("../_system/fonts/Tanker-Regular.woff2") format("woff2");font-display:block}
  /* The surface starts BELOW the fixed chrome, so nothing draws under the
     header and the frame centres in the space the eye actually has. The
     selector carries body[data-system] because the host sheet pins inset:0 on
     .instrument-renderer-surface at that specificity and would win otherwise. */
  .hero{position:fixed;inset:0;overflow:hidden;background:#0B0B0D}
  body[data-system="instrument"] .hero.instrument-renderer-surface{inset-block-start:var(--instrument-chrome-height)}
  body[data-system="instrument"][data-instrument-embed="true"] .hero.instrument-renderer-surface{inset-block-start:0}
  .hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  /* Below the kit's breakpoint the panel becomes a full-width sheet; letting it
     narrow the surface would leave nothing to draw in, so there it overlays. */
  @media (max-width: 767px){
    body[data-system="instrument"][data-controls="visible"] .hero.instrument-renderer-surface{inset-inline-end:0}
  }
  /* A five-option group cannot shrink below its own labels, so inside a row it
     spills out of the grid cell and over the row label. These sit full width
     under their label instead.

     The panel's horizontal inset lives on .instrument-row, not on the panel or
     the group — so a block that is NOT a row has to carry that same inset
     itself or it sits flush against the panel edge while every row beside it is
     indented. .bw-stack is exactly that: a row's padding and rhythm, without a
     row's three-column grid.

     The buttons are a grid, not wrapped flex: with flex-wrap a lone item on the
     last line stretches to the full width and reads as a heading rather than a
     button. auto-fit columns keep every option the same size however they land. */
  .bw-stack{padding-inline:var(--instrument-space-3);margin-block-start:var(--instrument-space-2)}
  /* Inside a disclosure the body carries the horizontal inset, so rows and
     stacks drop their own — otherwise everything double-indents. */
  .instrument-disclosure-body .instrument-row,
  .instrument-disclosure-body .bw-stack{padding-inline:0}
  /* The mini value field's width is the consumer's to set (the kit's own
     colour field does the same); sized for the widest value plus a unit. */
  /* The panel is 320px against vmax's ~512, so the row budget is tight:
     fixed slider, and the field sheds its inner padding to fit "-0.090 em". */
  [data-system="instrument"] .instrument-renderer-panel{--instrument-field-label-width:64px}
  [data-system="instrument"] .instrument-row .bw-mini{flex:none;inline-size:88px;min-inline-size:88px}
  [data-system="instrument"] .bw-mini .instrument-mini-input{flex:1 1 auto;inline-size:100%;min-inline-size:0}
  [data-system="instrument"] .instrument-renderer-panel .instrument-row .instrument-range{inline-size:120px}
  .bw-stack > .instrument-row-label{display:block;margin-block-end:var(--instrument-space-1)}
  .bw-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(4.6rem,1fr));gap:var(--instrument-space-1)}
  .bw-choice .instrument-action{min-inline-size:0}
  .bw-stack > .instrument-textarea{margin-block-end:var(--instrument-space-2)}
  /* The page's one station-level action, per the kit's GlassButton rule. The
     component ships as a 48px square; this instance carries a label, so it
     takes the stack's full width. Geometry only — the glass stays the kit's. */
  .bw-big{inline-size:100%;margin-block-end:var(--instrument-space-2)}
  .bw-big .instrument-action-glass{inline-size:100%}
</style>

<script src="../_kit/releases/0.1.0-1ff60f2032a6/instrument-runtime.js"></script>
<script src="../_system/adapters/adapter-core.js"></script>
<script src="../_system/adapters/bubble-scatter.js"></script>
<script src="../bubble-graffiti/bubble-core.js"></script>
<script src="../bubble-graffiti/scatter-core.js"></script>

<script>
/* =============================================================================
   Bubble Writer — one phrase, written into a frame a letter at a time.

   Read off the reference animation frame by frame:

   1. It is ONE SENTENCE, broken across lines and hand-laid in a zigzag down the
      frame — lines overlapping, each at its own size and place.
   2. A letter does not fade or slide in. Ink dots gather at its centre and the
      letter grows around them.
   3. It leaves the same way, reversed: the letter shrinks back towards nothing
      and the dots scatter out of it.

   The dots are INK. They have no opacity, ever — they are marks on paper, and a
   mark either exists or it does not. They shrink and they move; they never fade,
   because a fading dot reads as a screen effect and this has to read as ink.
   ========================================================================== */
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const $ = id => document.getElementById(id);
  const setV = (id, value) => { const node = $(id); if (!node) return; if (node.tagName === 'INPUT') node.value = value; else node.textContent = value; };
  const bubble = window.SUPERMEGA_BUBBLE;
  const mulberry = window.SUPERMEGA_SCATTER.mulberry;

  const FACES = {
    grotesk: '"Helvetica Neue", Inter, system-ui, Arial, sans-serif',
    mono: 'ui-monospace, "SF Mono", Menlo, monospace',
    serif: 'Georgia, "Times New Roman", Times, serif',
    tanker: '"Tanker", "Arial Black", sans-serif',
  };
  const ASPECTS = { '1:1': 1, '16:9': 16 / 9, '4:5': 4 / 5, '9:16': 9 / 16 };
  const DOT = 0.05;          // the size a letter starts at: a dot, not nothing
  const LEAD = 0.16;         // seconds the dots gather before the letter grows
  const DOT_OUT = 0.42;      // seconds the scattered dots survive on the way out
  const ENTER = 0.34;        // seconds one letter takes to arrive

  const S = { ...window.SUPERMEGA_INSTRUMENT_ADAPTERS.bubbleScatter.defaults, paused: false };
  let boardKey = "";   // the artboard the composition was last laid out against
  let lines = [];
  let letters = 0;
  let clock = 0;

  /* ---------- the artboard, centred in what you can actually see ---------- */
  // The kit already narrows .instrument-renderer-surface by the panel's width
  // when controls are open — so the CANVAS BOX is the visible strip, and it is
  // the only truth worth measuring. Everything before this measured the window
  // and reserved the panel by hand, which double-counted the panel AND left the
  // backing store sized to the full window while CSS displayed it narrower —
  // squeezing every frame ~21% horizontally and shoving it left.
  const stage = () => {
    const rect = canvas.getBoundingClientRect();
    return { height: Math.max(150, rect.height), width: Math.max(200, rect.width), x: 0, y: 0 };
  };
  const board = () => {
    const area = stage();
    const ratio = ASPECTS[S.aspect] || ASPECTS['16:9'];
    let width = area.width * 0.92;
    let height = width / ratio;
    const limit = area.height * 0.92;
    if (height > limit) { height = limit; width = height * ratio; }
    return { height, width, x: area.x + (area.width - width) / 2, y: area.y + (area.height - height) / 2 };
  };

  /* ---------- the cascade ---------- */
  const compose = () => {
    const frame = board();
    const inset = S.margin;
    const usableWidth = frame.width * (1 - inset * 2);
    const usableHeight = frame.height * (1 - inset * 2);
    const random = mulberry(S.seed);
    const source = S.text.split('\n').map(t => t.trim()).filter(Boolean);
    letters = 0;

    // The inflate a skeleton can carry depends on the skeleton: Tanker and
    // heavy weights close their counters far below the slider's ceiling, and
    // past that point every glyph is the same rounded slab. The dice already
    // respect this; the renderer must too, or a manual face/weight flip
    // destroys the letterforms at a slider value that read fine before.
    const skeleton = S.face === 'tanker' ? 0.055 : 0.12 - S.weight * 0.0001;
    lines = source.map((text) => {
      const built = bubble.phrase(text, {
        fontStack: FACES[S.face], inflate: Math.min(S.inflate, skeleton), jitter: 0.05, lean: 0.045,
        plump: S.plump, seed: S.seed, tracking: S.tracking, weight: S.weight, wobble: S.wobble,
      });
      const count = built.letters.length;
      letters += count;
      return {
        built, count,
        tilt: (random() * 2 - 1) * S.tilt * 0.07,
        wander: random() * 2 - 1,
        widthFraction: 0.62 * (1 - S.sizeVary * 0.35 + random() * S.sizeVary * 0.7),
      };
    }).filter(line => line.count > 0);

    // Lay the block out at unit scale first, then fit the whole thing at once.
    // Scaling line by line lets a long phrase walk off the bottom, and the point
    // of a declared frame is that the work stays inside its own edges.
    // A line's scale comes from its allotted box over its letter count — which
    // hands a two-letter line letters FIVE times the size of a ten-letter
    // line's, big enough to bury the small line entirely. Letter size may
    // vary; it may not dwarf. Clamp every line's scale around the median.
    for (const line of lines) {
      line.scale = (usableWidth * line.widthFraction) / (line.built.bounds.width || 1);
    }
    const scales = lines.map(l => l.scale).sort((a, b) => a - b);
    const median = scales.length ? scales[Math.floor(scales.length / 2)] : 1;
    let cursor = 0;
    let minX = Infinity;
    let maxX = -Infinity;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      line.scale = Math.max(median * 0.5, Math.min(median * 2.1, line.scale));
      const boxWidth = (line.built.bounds.width || 1) * line.scale;
      line.height = (line.built.bounds.height || 1) * line.scale;
      line.width = boxWidth;
      if (S.align === 'left') line.left = 0;
      else if (S.align === 'right') line.left = usableWidth - boxWidth;
      else if (S.align === 'centre') line.left = (usableWidth - boxWidth) / 2;
      else line.left = usableWidth * 0.5 + line.wander * S.cascade * usableWidth * 0.42 - boxWidth / 2;
      line.top = cursor;
      // Lines interlock by a fraction of the SMALLER of the two neighbours —
      // never of the previous line alone. Measured against the previous line,
      // "20% overlap" of a tall line swallows a short one whole; measured
      // against the smaller line, every line keeps the same visible share no
      // matter who its neighbours are. (Overlap past 1 becomes a gap.)
      const next = lines[i + 1];
      if (next) {
        const nextHeight = (next.built.bounds.height || 1) * Math.max(median * 0.5, Math.min(median * 2.1, next.scale));
        cursor += line.height - Math.min(line.height, nextHeight) * (1 - S.overlap);
      } else {
        cursor += line.height * S.overlap;
      }
      minX = Math.min(minX, line.left);
      maxX = Math.max(maxX, line.left + boxWidth);
    }
    const blockHeight = lines.length ? Math.max(...lines.map(l => l.top + l.height)) : 0;
    const blockWidth = Math.max(1, maxX - minX);
    const fit = Math.min(1, usableHeight / Math.max(1, blockHeight), usableWidth / blockWidth);
    const offsetY = frame.height * inset + (usableHeight - blockHeight * fit) / 2;
    const offsetX = frame.width * inset + (usableWidth - blockWidth * fit) / 2 - minX * fit;
    for (const line of lines) {
      line.scale *= fit;
      line.x = line.left * fit + offsetX;
      line.y = line.top * fit + offsetY;
      line.width *= fit;
      line.height *= fit;
    }

    // Centre the MASS, not just the box. A zigzag cascade can have a perfectly
    // centred bounding box while all its visual weight leans one way — which
    // reads as off-centre no matter what the geometry says. Shift the whole
    // block so the area-weighted centre sits on the frame's centre, clamped so
    // nothing leaves the margin.
    if (lines.length) {
      let weight = 0;
      let moment = 0;
      for (const line of lines) {
        const w = line.width * line.height;
        weight += w;
        moment += w * (line.x + line.width / 2);
      }
      const pad = frame.width * inset;
      const minLeft = Math.min(...lines.map(l => l.x));
      const maxRight = Math.max(...lines.map(l => l.x + l.width));
      let shift = frame.width / 2 - moment / weight;
      shift = Math.max(pad - minLeft, Math.min(shift, frame.width - pad - maxRight));
      if (Number.isFinite(shift)) for (const line of lines) line.x += shift;
    }
  };

  /* ---------- the timeline ---------- */
  const before = (index) => { let n = 0; for (let i = 0; i < index; i++) n += lines[i].count; return n; };
  const lineStart = (index) => (before(index) * (1 - S.lineStagger)) / Math.max(0.1, S.write);
  const writeEnd = () => lines.reduce((latest, line, i) => Math.max(latest, lineStart(i) + line.count / Math.max(0.1, S.write) + ENTER), 0);
  const eraseStart = () => writeEnd() + S.hold;
  const eraseEnd = () => eraseStart() + letters / Math.max(0.1, S.erase) + DOT_OUT;
  const cycleLength = () => eraseEnd() + 0.4;
  const letterAt = (li, j) => lineStart(li) + j / Math.max(0.1, S.write);
  const letterGone = (li, j) => eraseStart() + (before(li) + j) / Math.max(0.1, S.erase);

  // easeOutBack: starts at 0, overshoots past 1, settles. The overshoot IS the
  // pop; without it a letter merely grows and reads as a zoom.
  const popCurve = (t, amount) => {
    if (t >= 1) return 1;
    if (t <= 0) return 0;
    const s = 1.70158 * (0.35 + amount * 1.4);
    const u = t - 1;
    return 1 + u * u * ((s + 1) * u + s);
  };
  const easeOut = t => 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);

  /* ---------- ink dots ---------- */
  // Symmetrical by construction: the same cluster gathers inward before a letter
  // and scatters outward after it. Solid ink, shrinking — never alpha.
  const dotCluster = (li, j) => {
    const count = Math.round(1 + S.dots * 5);
    const out = [];
    for (let k = 0; k < count; k++) {
      const r = mulberry((li * 8191 + j * 271 + k * 53) >>> 0);
      out.push({ angle: r() * Math.PI * 2, reach: 0.35 + r() * 0.65, size: 0.55 + r() * 0.9 });
    }
    return out;
  };

  // Dots belong to particular animations, not to all of them. A letter that
  // inflates came from somewhere and the dots are where it came from; a letter
  // that drops in did not, and sprinkling dots under it just looks like debris.
  const ENTRANCE_DOTS = new Set(['inflate']);
  const EXIT_DOTS = new Set(['deflate', 'burst']);

  const drawDots = (target, now) => {
    if (S.dots <= 0) return;
    const gathers = ENTRANCE_DOTS.has(S.entrance);
    const scatters = EXIT_DOTS.has(S.exit);
    if (!gathers && !scatters) return;
    const erasing = S.loop !== 'hold';
    lines.forEach((line, li) => {
      for (let j = 0; j < line.count; j++) {
        const item = line.built.letters[j];
        const cx = line.x + (item.x + item.cx - line.built.bounds.minX) * line.scale;
        const cy = line.y + (item.y + item.cy - line.built.bounds.minY) * line.scale;
        const unit = line.height * 0.5;

        // Gathering in: dots start spread and close on the centre, then the
        // letter grows over them.
        const arrive = letterAt(li, j);
        const gatherFrom = arrive - LEAD;
        if (gathers && now >= gatherFrom && now < arrive + ENTER * 0.5) {
          const t = Math.min(1, (now - gatherFrom) / (LEAD + ENTER * 0.5));
          for (const dot of dotCluster(li, j)) {
            const spread = (1 - easeOut(t)) * dot.reach * unit * 0.5 * (0.4 + S.dots);
            const radius = dot.size * unit * 0.05 * S.dotSize * (1 - t * 0.55);
            if (radius <= 0.2) continue;
            target.beginPath();
            target.arc(cx + Math.cos(dot.angle) * spread, cy + Math.sin(dot.angle) * spread, radius, 0, Math.PI * 2);
            target.fill();
          }
        }

        // Scattering out: the same cluster, running the other way.
        if (!erasing || !scatters) continue;
        const gone = letterGone(li, j);
        if (now >= gone && now < gone + DOT_OUT) {
          const t = (now - gone) / DOT_OUT;
          for (const dot of dotCluster(li, j)) {
            const spread = easeOut(t) * dot.reach * unit * 0.75 * (0.4 + S.dots);
            const radius = dot.size * unit * 0.05 * S.dotSize * (1 - t);
            if (radius <= 0.2) continue;
            target.beginPath();
            target.arc(cx + Math.cos(dot.angle) * spread, cy + Math.sin(dot.angle) * spread - t * unit * 0.1, radius, 0, Math.PI * 2);
            target.fill();
          }
        }
      }
    });
  };

  /* ---------- ink, flat or gradient ---------- */
  // A gradient has to run across the WHOLE composition, but each line is drawn
  // under its own rotation and scale. So the board-space endpoints are pushed
  // back through that transform and the gradient is built in the line's own
  // coordinates — which keeps it continuous from one line to the next.
  const toLocal = (line, px, py) => {
    const ux = px - (line.x + line.width / 2);
    const uy = py - (line.y + line.height / 2);
    const c = Math.cos(-line.tilt);
    const s = Math.sin(-line.tilt);
    const vx = (ux * c - uy * s + line.width / 2) / line.scale;
    const vy = (ux * s + uy * c + line.height / 2) / line.scale;
    return { x: vx + line.built.bounds.minX, y: vy + line.built.bounds.minY };
  };
  const inkFor = (target, line, frame) => {
    if (!S.gradient) return S.ink;
    const rad = (S.angle * Math.PI) / 180;
    const half = Math.hypot(frame.width, frame.height) / 2;
    const cx = frame.width / 2;
    const cy = frame.height / 2;
    const a = toLocal(line, cx - Math.cos(rad) * half, cy - Math.sin(rad) * half);
    const b = toLocal(line, cx + Math.cos(rad) * half, cy + Math.sin(rad) * half);
    const gradient = target.createLinearGradient(a.x, a.y, b.x, b.y);
    gradient.addColorStop(0, S.ink);
    gradient.addColorStop(1, S.ink2);
    return gradient;
  };
  const flatInk = (target, frame) => {
    if (!S.gradient) return S.ink;
    const rad = (S.angle * Math.PI) / 180;
    const half = Math.hypot(frame.width, frame.height) / 2;
    const gradient = target.createLinearGradient(
      frame.width / 2 - Math.cos(rad) * half, frame.height / 2 - Math.sin(rad) * half,
      frame.width / 2 + Math.cos(rad) * half, frame.height / 2 + Math.sin(rad) * half,
    );
    gradient.addColorStop(0, S.ink);
    gradient.addColorStop(1, S.ink2);
    return gradient;
  };

  /* ---------- paint ---------- */
  const fit = () => {
    const ratio = Math.min(devicePixelRatio || 1, 2);
    const area = stage();
    canvas.width = Math.round(area.width * ratio);
    canvas.height = Math.round(area.height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  };

  const paintBoard = (target, frame, now) => {
    const erasing = S.loop !== 'hold';
    // One outline weight for the whole piece. `stroke` is a fraction of a
    // reference cap height (half the frame), turned into board pixels once —
    // then each line divides it back out by its own scale, so a word set twice
    // as large is not drawn twice as heavily.
    const strokePx = S.stroke * frame.height * 0.5;
    // Knockout channels (solid, halo, sticker) are also constant on screen —
    // but a constant band wide enough to separate two big lines will SHRED a
    // small line caught behind it. Cap each line's knockout against its OWN
    // neighbour (the line it actually overlaps), not the board's smallest
    // line — a global cap turns every channel hairline the moment any one
    // line is tiny, and the whole piece fuses. A modest floor keeps the
    // channel visible even beside a small neighbour.
    const knock = (li, want, share) => {
      const line = lines[li];
      const behind = lines[li + 1];
      const neighbour = Math.min(line.height, behind ? behind.height : line.height);
      return Math.max(Math.min(strokePx * want, neighbour * share), strokePx * 1.2);
    };

    // Dots go down first, so a growing letter's fill covers the cluster it grew
    // out of — the letter really does close over its own dots.
    target.fillStyle = flatInk(target, frame);
    drawDots(target, now);

    // The reference stacks in READING order: the first letter sits on top and
    // every following letter tucks behind it — between lines too. So lines
    // paint last-first here and letters paint in reverse inside drawPhrase,
    // while the timeline still arrives first-to-last: a new letter inflates
    // BEHIND the ones already standing, exactly as the video reads.
    for (let li = lines.length - 1; li >= 0; li--) {
      const line = lines[li];
      const written = (now - lineStart(li)) * Math.max(0.1, S.write);
      if (written <= 0) continue;
      const ink = inkFor(target, line, frame);

      const letterFx = (index, fraction) => {
        let scale = 1;
        let rotate = 0;
        let y = 0;
        const t = fraction;
        if (S.entrance === 'inflate') scale = DOT + (1 - DOT) * popCurve(t, S.pop);
        else if (S.entrance === 'pop') scale = popCurve(t, S.pop);
        else if (S.entrance === 'drop') y = -(1 - easeOut(t)) * 0.7;
        else if (S.entrance === 'rise') y = (1 - easeOut(t)) * 0.7;
        else { rotate = (1 - easeOut(t)) * 0.6; scale = 0.55 + 0.45 * easeOut(t); }

        if (erasing) {
          const out = (now - letterGone(li, index)) / 0.26;
          if (out >= 1) return { scale: 0.0001 };
          if (out > 0) {
            if (S.exit === 'deflate') scale *= (1 - out) * (1 - out);
            else if (S.exit === 'burst') scale *= out < 0.12 ? 1 : 0.0001;
            else if (S.exit === 'drop') y += out * out * 1.4;
            else scale *= 1 - out;
          }
        }
        if (S.jiggle > 0 && fraction >= 1) {
          const phase = li * 1.9 + index * 0.7;
          scale *= 1 + S.jiggle * 0.028 * Math.sin(now * 2.1 + phase);
          rotate += S.jiggle * 0.045 * Math.sin(now * 1.7 + phase * 1.3);
          y += S.jiggle * 0.01 * Math.sin(now * 1.3 + phase * 0.6);
        }
        // A hand never draws two letters the same size. A small seeded puff
        // per letter — static, not animated — is much of the reference's charm.
        scale *= 0.94 + mulberry((li * 8191 + index * 271 + 7) >>> 0)() * 0.12;
        return { rotate, scale: Math.max(0.0001, scale), y };
      };

      target.save();
      target.translate(line.x + line.width / 2, line.y + line.height / 2);
      target.rotate(line.tilt);
      target.translate(-line.width / 2, -line.height / 2);
      target.scale(line.scale, line.scale);
      target.translate(-line.built.bounds.minX, -line.built.bounds.minY);

      const progress = Math.min(1, written / line.count);
      const pass = (options) => bubble.drawPhrase(target, line.built, { letterFx, order: 'reverse', progress, whole: true, ...options });
      const w = strokePx / line.scale;

      if (S.style === 'outline') pass({ fill: S.paper, lineWidth: w, stroke: ink });
      else if (S.style === 'solid') {
        // Solid has no dark outline to separate letters, so overlapping ink
        // fuses into one silhouette. A paper knockout under the line carves it
        // out of the line behind, and a thicker per-letter paper stroke keeps
        // the channels readable between letters within the word.
        pass({ fill: null, lineWidth: knock(li, 3.5, 0.3) / line.scale, stroke: S.paper });
        // The within-word channel is capped by the line's own height: constant
        // screen pixels are right for outline weight, but on a small line a
        // constant channel eats a quarter of every letter and shreds the word.
        pass({ fill: ink, lineWidth: Math.min(strokePx * 1.4, line.height * 0.09) / line.scale, stroke: S.paper });
      }
      else if (S.style === 'shadow') {
        target.save(); target.translate(w * 2.4, w * 3.1);
        pass({ fill: ink, lineWidth: w, stroke: ink });
        target.restore();
        pass({ fill: S.paper, lineWidth: w, stroke: ink });
      } else if (S.style === 'halo') {
        pass({ fill: null, lineWidth: knock(li, 6, 0.4) / line.scale, stroke: S.paper });
        pass({ fill: S.paper, lineWidth: w, stroke: ink });
      } else {
        pass({ fill: null, lineWidth: knock(li, 9, 0.45) / line.scale, stroke: S.paper });
        pass({ fill: ink, lineWidth: w * 1.2, stroke: ink });
      }
      target.restore();
    }
  };

  const paint = (target, now) => {
    const area = stage();
    const frame = board();
    // The composition is laid out against a particular artboard. If that board
    // has changed since — a resize that fired no event, browser zoom, the panel
    // opening — the letters would still be placed for the old one while the
    // paper is drawn for the new, which reads as the work sitting off-centre.
    // Re-fitting the backing store AND re-laying out on any change makes the
    // canvas box, its pixels, and the composition impossible to disagree.
    const key = `${Math.round(area.width)}x${Math.round(area.height)}`;
    if (key !== boardKey) { boardKey = key; fit(); compose(); }
    target.fillStyle = '#0B0B0D';
    target.fillRect(0, 0, area.width, area.height);
    target.save();
    target.beginPath();
    target.rect(frame.x, frame.y, frame.width, frame.height);
    target.clip();
    target.fillStyle = S.paper;
    target.fillRect(frame.x, frame.y, frame.width, frame.height);
    target.translate(frame.x, frame.y);
    paintBoard(target, frame, now);
    target.restore();
  };

  let last = performance.now();
  const frame = (stamp) => {
    const delta = Math.min(0.05, (stamp - last) / 1000);
    last = stamp;
    if (!S.paused) clock += delta * S.speed;
    if (S.loop === 'cycle' && clock > cycleLength()) clock = 0;
    if (S.loop === 'once' && clock > eraseEnd()) clock = eraseEnd();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    paint(ctx, clock);
    requestAnimationFrame(frame);
  };

  /* ---------- artifacts ---------- */
  const createArtifact = () => {
    const box = board();
    const scale = 2;
    const off = document.createElement('canvas');
    off.width = Math.round(box.width * scale);
    off.height = Math.round(box.height * scale);
    const target = off.getContext('2d');
    target.scale(scale, scale);
    target.fillStyle = S.paper;
    target.fillRect(0, 0, box.width, box.height);
    target.save();
    target.beginPath();
    target.rect(0, 0, box.width, box.height);
    target.clip();
    paintBoard(target, box, Math.max(0, eraseStart() - 0.01));
    target.restore();
    return { dataUrl: off.toDataURL('image/png'), filename: `bubble-writer-${S.style}-${S.aspect.replace(':', 'x')}.png`, height: off.height, mime: 'image/png', width: off.width };
  };

  /* ---------- motion artifacts ----------
     paintBoard is a pure function of time, so an export REPLAYS the cycle into
     an offscreen board rather than grabbing the screen: video records that
     replay in real time through MediaRecorder; the GIF walks fixed timesteps
     offline and is encoded here byte for byte — the lab ships no dependencies,
     and GIF89a is small enough to own. */
  const exportSpan = () => (S.loop === 'hold' ? writeEnd() + S.hold : cycleLength());
  const exportSurface = (maxWidth) => {
    const box = board();
    const scale = Math.min(2, maxWidth / box.width);
    const off = document.createElement('canvas');
    off.width = Math.round(box.width * scale);
    off.height = Math.round(box.height * scale);
    return { box, off, scale, target: off.getContext('2d', { willReadFrequently: true }) };
  };
  const drawExportFrame = (surface, t) => {
    const { box, scale, target } = surface;
    target.setTransform(scale, 0, 0, scale, 0, 0);
    target.fillStyle = S.paper;
    target.fillRect(0, 0, box.width, box.height);
    target.save();
    target.beginPath();
    target.rect(0, 0, box.width, box.height);
    target.clip();
    paintBoard(target, box, t);
    target.restore();
  };
  const saveBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };
  let exporting = false;

  const recordVideo = () => {
    if (exporting || typeof MediaRecorder === 'undefined') return;
    exporting = true;
    const button = $('b-video');
    const rate = S.speed > 0.05 ? S.speed : 1;
    const span = Math.min(30, exportSpan() / rate);
    const surface = exportSurface(1920);
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    const recorder = new MediaRecorder(surface.off.captureStream(30), { mimeType: mime, videoBitsPerSecond: 8e6 });
    const parts = [];
    recorder.ondataavailable = e => { if (e.data.size) parts.push(e.data); };
    recorder.onstop = () => {
      saveBlob(new Blob(parts, { type: 'video/webm' }), `bubble-writer-${S.aspect.replace(':', 'x')}.webm`);
      exporting = false;
      button.textContent = 'Video';
    };
    drawExportFrame(surface, 0);
    recorder.start();
    const started = performance.now();
    const step = () => {
      const t = (performance.now() - started) / 1000;
      button.textContent = `Rec ${Math.min(99, Math.round((t / span) * 100))}%`;
      if (t >= span) { recorder.stop(); return; }
      drawExportFrame(surface, t * rate);
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  // A 6×7×6 colour cube (252 entries): flat ink under antialiasing needs no
  // better palette, and a fixed cube keeps quantization a table lookup.
  const GIF_PALETTE = (() => {
    const pal = new Uint8Array(768);
    for (let r = 0; r < 6; r++) for (let g = 0; g < 7; g++) for (let b = 0; b < 6; b++) {
      const i = (r * 42 + g * 6 + b) * 3;
      pal[i] = Math.round(r * 51);
      pal[i + 1] = Math.round((g * 255) / 6);
      pal[i + 2] = Math.round(b * 51);
    }
    return pal;
  })();
  const quantize = (data) => {
    const out = new Uint8Array(data.length / 4);
    for (let i = 0, p = 0; p < out.length; i += 4, p++) {
      out[p] = Math.round(data[i] / 51) * 42 + Math.round((data[i + 1] * 6) / 255) * 6 + Math.round(data[i + 2] / 51);
    }
    return out;
  };
  const gifLzw = (pixels) => {
    const out = [];
    let buffer = 0;
    let bits = 0;
    const emit = (code, size) => {
      buffer |= code << bits;
      bits += size;
      while (bits >= 8) { out.push(buffer & 255); buffer >>= 8; bits -= 8; }
    };
    const CLEAR = 256;
    const EOI = 257;
    let dict;
    let next;
    let size;
    const reset = () => { dict = new Map(); next = EOI + 1; size = 9; };
    reset();
    emit(CLEAR, size);
    let prev = pixels[0];
    for (let i = 1; i < pixels.length; i++) {
      const key = (prev << 8) | pixels[i];
      const hit = dict.get(key);
      if (hit !== undefined) { prev = hit; continue; }
      emit(prev, size);
      if (next === 4096) { emit(CLEAR, size); reset(); }
      else {
        // Widen BEFORE storing, when the code about to be assigned needs the
        // extra bit — widening after the store desyncs the decoder one code
        // early and the stream stops decoding. Proven against ffmpeg.
        if (next >= (1 << size)) size += 1;
        dict.set(key, next);
        next += 1;
      }
      prev = pixels[i];
    }
    emit(prev, size);
    emit(EOI, size);
    if (bits > 0) out.push(buffer & 255);
    return out;
  };
  const encodeGif = (frames, width, height, delay) => {
    const bytes = [];
    const push16 = v => bytes.push(v & 255, (v >> 8) & 255);
    for (const ch of 'GIF89a') bytes.push(ch.charCodeAt(0));
    push16(width);
    push16(height);
    bytes.push(0xF7, 0, 0);
    for (const b of GIF_PALETTE) bytes.push(b);
    bytes.push(0x21, 0xFF, 11);
    for (const ch of 'NETSCAPE2.0') bytes.push(ch.charCodeAt(0));
    bytes.push(3, 1, 0, 0, 0);
    for (const frame of frames) {
      bytes.push(0x21, 0xF9, 4, 4, delay & 255, (delay >> 8) & 255, 0, 0);
      bytes.push(0x2C);
      push16(0);
      push16(0);
      push16(width);
      push16(height);
      bytes.push(0, 8);
      const data = gifLzw(frame);
      for (let off = 0; off < data.length; off += 255) {
        const n = Math.min(255, data.length - off);
        bytes.push(n);
        for (let j = 0; j < n; j++) bytes.push(data[off + j]);
      }
      bytes.push(0);
    }
    bytes.push(0x3B);
    return new Uint8Array(bytes);
  };

  const recordGif = async () => {
    if (exporting) return;
    exporting = true;
    const button = $('b-gif');
    const rate = S.speed > 0.05 ? S.speed : 1;
    const fps = 12;
    const span = Math.min(15, exportSpan() / rate);
    const surface = exportSurface(640);
    const frames = [];
    const count = Math.max(1, Math.ceil(span * fps));
    for (let i = 0; i < count; i++) {
      drawExportFrame(surface, (i / fps) * rate);
      frames.push(quantize(surface.target.getImageData(0, 0, surface.off.width, surface.off.height).data));
      if (i % 8 === 7) {
        button.textContent = `GIF ${Math.round((i / count) * 100)}%`;
        await new Promise(r => requestAnimationFrame(r));
      }
    }
    button.textContent = 'Encoding…';
    await new Promise(r => requestAnimationFrame(r));
    const bytes = encodeGif(frames, surface.off.width, surface.off.height, Math.round(100 / fps));
    saveBlob(new Blob([bytes], { type: 'image/gif' }), `bubble-writer-${S.aspect.replace(':', 'x')}.gif`);
    exporting = false;
    button.textContent = 'GIF';
  };

  const clearTags = () => { clock = 0; return { tags: 0 }; };

  /* ---------- wiring ---------- */
  const setControlsVisible = visible => {
    $('panel').classList.toggle('hidden', !visible);
    document.body.dataset.controls = visible ? 'visible' : 'hidden';
    $('toggle').setAttribute('aria-pressed', String(visible));
    compose();
    return { visible };
  };
  const setPressed = (selector, match) => document.querySelectorAll(selector).forEach(el => {
    el.setAttribute('aria-pressed', String(match(el)));
  });
  const phase = () => {
    if (clock < writeEnd()) return 'WRITING';
    if (S.loop === 'hold' || clock < eraseStart()) return 'HELD';
    return 'LEAVING';
  };
  function syncStat() { setV('stat', `${S.paused ? 'PAUSED' : phase()} · ${S.style.toUpperCase()}`); }

  const syncControls = c => {
    setPressed('#f-style [data-style]', el => el.dataset.style === c.style);
    setPressed('#f-face [data-face]', el => el.dataset.face === c.face);
    setPressed('#f-entrance [data-entrance]', el => el.dataset.entrance === c.entrance);
    setPressed('#f-exit [data-exit]', el => el.dataset.exit === c.exit);
    setPressed('#f-loop [data-loop]', el => el.dataset.loop === c.loop);
    setPressed('#f-aspect [data-aspect]', el => el.dataset.aspect === c.aspect);
    setPressed('#f-align [data-align]', el => el.dataset.align === c.align);
    setPressed('#f-preset [data-ink]', el => el.dataset.ink.toLowerCase() === c.ink && el.dataset.paper.toLowerCase() === c.paper);
    if ($('f-text').value !== c.text) $('f-text').value = c.text;
    for (const [picker, hex, value] of [['p-ink', 'h-ink', c.ink], ['p-paper', 'h-paper', c.paper], ['p-ink2', 'h-ink2', c.ink2]]) {
      $(picker).value = value;
      if ($(hex).value.trim().toLowerCase() !== value) $(hex).value = value;
    }
    $('f-gradient').checked = c.gradient;
    setV('v-gradient', c.gradient ? 'ON' : 'OFF');
    setV('v-seed', String(c.seed));
    const values = {
      's-angle': [c.angle, 'v-angle', 0], 's-cascade': [c.cascade, 'v-cascade', 2],
      's-dots': [c.dots, 'v-dots', 2], 's-dotsize': [c.dotSize, 'v-dotsize', 2],
      's-erase': [c.erase, 'v-erase', 1], 's-hold': [c.hold, 'v-hold', 1],
      's-inflate': [c.inflate, 'v-inflate', 3], 's-jiggle': [c.jiggle, 'v-jiggle', 2],
      's-lead': [c.lineStagger, 'v-lead', 2], 's-margin': [c.margin, 'v-margin', 3],
      's-overlap': [c.overlap, 'v-overlap', 2], 's-plump': [c.plump, 'v-plump', 2],
      's-pop': [c.pop, 'v-pop', 2], 's-speed': [c.speed, 'v-speed', 2],
      's-stroke': [c.stroke, 'v-stroke', 3], 's-tilt': [c.tilt, 'v-tilt', 2],
      's-track': [c.tracking, 'v-track', 3], 's-vary': [c.sizeVary, 'v-vary', 2],
      's-weight': [c.weight, 'v-weight', 0], 's-wobble': [c.wobble, 'v-wobble', 4],
      's-write': [c.write, 'v-write', 1],
    };
    Object.entries(values).forEach(([id, [value, output, decimals]]) => {
      $(id).value = value;
      setV(output, Number(value).toFixed(decimals));
    });
  };

  // Motion and colour can be tuned while it runs. Anything that changes the
  // letterform or the composition lays it out again and replays from the top.
  const COMPOSE_KEYS = ['align', 'aspect', 'cascade', 'face', 'inflate', 'margin', 'overlap', 'plump', 'seed', 'sizeVary', 'text', 'tilt', 'tracking', 'weight', 'wobble'];
  const applyConfiguration = c => {
    const relayout = COMPOSE_KEYS.some(key => S[key] !== c[key]);
    Object.assign(S, c);
    if (relayout || !lines.length) { compose(); clock = 0; }
    syncControls(c);
    syncStat();
  };

  /* ---------- randomize ---------- */
  // Rolls the whole instrument except the three things that are the user's
  // decision rather than the machine's: the PHRASE, the output frame, and how
  // fast they want to watch it. Everything that makes the piece look and move
  // the way it does is fair game.
  const INK_PAIRS = [
    ['#101014', '#FBFAF7'], ['#F61515', '#FBFAF7'], ['#FBFAF7', '#101014'],
    ['#FBFAF7', '#F61515'], ['#C8FF00', '#101014'], ['#FF3D8B', '#FFF3E6'],
    ['#0A2A6B', '#EFEAD8'], ['#1B4D2E', '#F3F1E7'], ['#101014', '#F2C230'],
    ['#4B1AC7', '#F7F2FF'], ['#FF5C00', '#1A1208'],
  ];
  const one = list => list[Math.floor(Math.random() * list.length)];
  const span = (lo, hi, places = 2) => Number((lo + Math.random() * (hi - lo)).toFixed(places));

  // The dice may not roll mush. Some combinations are illegible by
  // construction — solid ink at high inflate with tight lines fuses into one
  // black mass — so the roll is clamped after the fact, the same reasoning as
  // curated ink pairs: a randomizer that often produces garbage stops being
  // worth pressing.
  const legible = (variant) => {
    // Inflate and plump both swell the form; past a joint point the letter
    // forgets its own topology and every glyph becomes the same rounded slab
    // (NOTES pins ~0.11 inflate as the edge of the form). Whatever the style,
    // keep the pair inside the readable band, and stop huge letters from
    // coinciding by flooring tracking and line spacing as inflation rises.
    // The inflate a skeleton can carry depends on how fat it already is: a
    // heavy weight or a display face like Tanker closes its counters long
    // before the slider's ceiling. Cap inflate by the skeleton itself.
    const skeletonCap = variant.face === 'tanker' ? 0.05 : 0.115 - variant.weight * 0.0001;
    variant.inflate = Math.min(variant.inflate, skeletonCap);
    if (variant.inflate > 0.085) variant.plump = Math.min(variant.plump, 0.8);
    if (variant.inflate > 0.095) {
      variant.tracking = Math.max(variant.tracking, -0.06);
      variant.overlap = Math.max(variant.overlap, 0.82);
    }
    if (variant.style === 'solid' || variant.style === 'sticker') {
      variant.inflate = Math.min(variant.inflate, 0.085);
      variant.overlap = Math.max(variant.overlap, 0.8);
      variant.tracking = Math.max(variant.tracking, -0.08);
      variant.sizeVary = Math.min(variant.sizeVary, 0.55);
      // Solid letters are separated only by their paper channels, and a thin
      // rolled stroke makes those channels vanish — every muddy solid roll
      // traced back to stroke near the floor. Solid earns a thicker minimum.
      variant.stroke = Math.max(variant.stroke, 0.022);
    }
    return variant;
  };

  const randomVariant = () => {
    // Curated pairs, not random hex: two random colours are usually mud, and a
    // randomizer that mostly produces mud stops being worth pressing.
    const [ink, paper] = one(INK_PAIRS);
    const gradient = Math.random() < 0.35;
    const entrance = one(['inflate', 'pop', 'drop', 'rise', 'swing']);
    return legible({
      align: one(['cascade', 'cascade', 'cascade', 'left', 'centre', 'right']),
      angle: Math.floor(Math.random() * 360),
      // The frame is part of the look, not just an output setting — a square
      // and a 9:16 compose completely differently, so the dice rolls it too.
      aspect: one(['16:9', '16:9', '1:1', '4:5', '9:16']),
      cascade: span(0.15, 1),
      dotSize: span(0.25, 1),
      dots: span(0.2, 1),
      entrance,
      erase: span(4, 26, 1),
      exit: one(['deflate', 'burst', 'drop', 'shrink']),
      face: one(['grotesk', 'tanker', 'serif', 'mono']),
      gradient,
      hold: span(0.4, 2.6, 1),
      ink,
      ink2: one(INK_PAIRS)[0],
      inflate: span(0.06, 0.105, 3),
      jiggle: span(0, 0.7),
      lineStagger: span(0, 0.7),
      overlap: span(0.62, 1.05),
      paper,
      plump: span(0.55, 0.95),
      pop: span(0.2, 1),
      seed: 1 + Math.floor(Math.random() * 9999),
      sizeVary: span(0, 0.9),
      stroke: span(0.014, 0.034, 3),
      style: one(['outline', 'outline', 'solid', 'shadow', 'halo', 'sticker']),
      tilt: span(0, 0.8),
      tracking: span(-0.12, -0.02, 3),
      weight: 100 + Math.round(Math.random() * 10) * 25,
      wobble: span(0, 0.012, 4),
    });
  };

  const adapter = window.SUPERMEGA_INSTRUMENT_ADAPTERS.bubbleScatter.create({
    applyConfiguration,
    clearTags,
    createArtifact,
    hideControls: () => setControlsVisible(false),
    nextVariant: () => randomVariant(),
    pause: () => { S.paused = true; $('b-pause').textContent = 'Play'; syncStat(); return { paused: true }; },
    resume: () => { S.paused = false; $('b-pause').textContent = 'Pause'; syncStat(); return { paused: false }; },
    showControls: () => setControlsVisible(true),
  });

  const rangeContract = window.SUPERMEGA_INSTRUMENT_ADAPTERS.core.installRangeContract(document);
  addEventListener('resize', () => { fit(); compose(); });

  const choice = (id, key) => $(id).querySelectorAll(`[data-${key}]`).forEach(b =>
    b.addEventListener('click', () => adapter.configure({ [key]: b.dataset[key] })));
  choice('f-style', 'style'); choice('f-face', 'face'); choice('f-entrance', 'entrance');
  choice('f-exit', 'exit'); choice('f-loop', 'loop'); choice('f-aspect', 'aspect'); choice('f-align', 'align');

  $('f-preset').querySelectorAll('[data-ink]').forEach(b =>
    b.addEventListener('click', () => adapter.configure({ ink: b.dataset.ink, paper: b.dataset.paper })));
  $('f-text').addEventListener('input', e => adapter.configure({ text: e.target.value }));
  $('f-gradient').addEventListener('change', e => adapter.configure({ gradient: e.target.checked }));
  // The adapter is stateless about colour: it cannot know a "last good" value,
  // so anything it cannot read falls back to the default. Typing "#1", "#12"…
  // would therefore flash the work black on every keystroke. The guard belongs
  // here — a half-typed hex is simply not sent until it is a colour.
  const COMPLETE_HEX = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/iu;
  for (const [picker, hex, key] of [['p-ink', 'h-ink', 'ink'], ['p-paper', 'h-paper', 'paper'], ['p-ink2', 'h-ink2', 'ink2']]) {
    $(picker).addEventListener('input', e => adapter.configure({ [key]: e.target.value }));
    $(hex).addEventListener('input', e => {
      if (COMPLETE_HEX.test(e.target.value.trim())) adapter.configure({ [key]: e.target.value });
    });
  }

  const rangeBindings = {
    's-angle': 'angle', 's-cascade': 'cascade', 's-dots': 'dots', 's-dotsize': 'dotSize',
    's-erase': 'erase', 's-hold': 'hold', 's-inflate': 'inflate', 's-jiggle': 'jiggle',
    's-lead': 'lineStagger', 's-margin': 'margin', 's-overlap': 'overlap', 's-plump': 'plump',
    's-pop': 'pop', 's-speed': 'speed', 's-stroke': 'stroke', 's-tilt': 'tilt',
    's-track': 'tracking', 's-vary': 'sizeVary', 's-weight': 'weight', 's-wobble': 'wobble',
    's-write': 'write',
  };
  Object.entries(rangeBindings).forEach(([id, key]) =>
    $(id).addEventListener('input', e => adapter.configure({ [key]: Number(e.target.value) })));

  $('b-reseed').addEventListener('click', () => adapter.execute('reseed-renderer'));
  $('b-replay').addEventListener('click', () => { clock = 0; });
  $('b-pause').addEventListener('click', () => adapter.execute(S.paused ? 'resume' : 'pause'));
  $('b-random-big').addEventListener('click', () => adapter.execute('randomize'));
  $('b-defaults').addEventListener('click', () => adapter.execute('reset-configuration'));
  $('scatter-controls-title').addEventListener('dblclick', () => adapter.execute('reset-configuration'));
  $('b-hide').addEventListener('click', () => adapter.execute('hide-controls'));
  $('toggle').addEventListener('click', () => adapter.execute($('panel').classList.contains('hidden') ? 'show-controls' : 'hide-controls'));
  $('b-png').addEventListener('click', () => {
    const result = adapter.execute('create-artifact');
    if (!result.ok) return;
    const anchor = document.createElement('a');
    anchor.href = result.value.dataUrl;
    anchor.download = result.value.filename;
    anchor.click();
  });
  $('b-video').addEventListener('click', recordVideo);
  $('b-gif').addEventListener('click', recordGif);

  addEventListener('keydown', event => {
    const editable = event.target instanceof HTMLElement && (event.target.matches('input, select, textarea') || event.target.isContentEditable);
    if (editable) return;
    if (event.key === 'h' || event.key === 'H') adapter.execute($('panel').classList.contains('hidden') ? 'show-controls' : 'hide-controls');
    if (event.key === 'r' || event.key === 'R') clock = 0;
    if (event.key === 'v' || event.key === 'V') adapter.execute('randomize');
    if (event.key === 'e' || event.key === 'E') $('b-png').click();
    if (event.key === ' ') { event.preventDefault(); adapter.execute(S.paused ? 'resume' : 'pause'); }
  });

  const instrumentState = window.SUPERMEGA_INSTRUMENT.createState();
  instrumentState.appearance.grain = false;
  instrumentState.shell.overviewVisible = false;
  window.BUBBLE_SCATTER_MATERIALS = window.SUPERMEGA_INSTRUMENT.enhance(document.body, instrumentState);
  window.BUBBLE_SCATTER_ADAPTER = adapter;
  window.BUBBLE_SCATTER_RANGE_CONTRACT = rangeContract;
  window.BUBBLE_WRITER_STATE = () => ({ clock, cycle: cycleLength(), eraseStart: eraseStart(), letters, lines: lines.length, writeEnd: writeEnd() });
  window.BUBBLE_WRITER_SEEK = (t) => { clock = t; };
  window.BUBBLE_WRITER_BOARD = () => board();
  if (window.parent !== window) window.BUBBLE_SCATTER_BRIDGE = window.SUPERMEGA_INSTRUMENT_ADAPTERS.core.installBridge(adapter);

  const ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.resolve(ready).then(() => {
    fit();
    applyConfiguration(adapter.getConfiguration());
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) adapter.configure({ jiggle: 0, speed: 0 });
    requestAnimationFrame(frame);
    window.BUBBLE_SCATTER_READY = true;
  });
})();
</script>
<script>
/* Dev-only: the Agentation annotation toolbar, for markup sessions against the
   local server. Guarded to localhost so the published page never loads it. */
(() => {
  if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
  const s = document.createElement('script');
  s.type = 'module';
  s.id = 'agentation-loader';
  s.textContent = `
    import React from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1';
    import { Agentation } from 'https://esm.sh/agentation@3.0.2?deps=react@18.3.1,react-dom@18.3.1';
    const mount = document.createElement('div');
    mount.id = 'agentation-root';
    document.body.appendChild(mount);
    createRoot(mount).render(React.createElement(Agentation, { endpoint: 'http://localhost:4747' }));
  `;
  document.head.appendChild(s);
})();
</script>
</body>
</html>
