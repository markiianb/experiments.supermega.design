<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUPERMEGA lab — 03 · 404 wilted garden</title>
<style>
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .hud {
    position: fixed; top: 64px; right: 24px; z-index: 5;
    font-size: 12px; letter-spacing: .04em; text-align: right;
  }
  .msg {
    position: fixed; left: 50%; top: 55%; transform: translateX(-50%);
    z-index: 5; text-align: center; font-size: 13px; line-height: 1.9;
    pointer-events: none; width: min(90vw, 480px);
  }
  .msg a { pointer-events: auto; color: inherit; }
  .caption {
    position: fixed; left: 24px; top: 64px; z-index: 5;
    font-size: 11px; opacity: .55; max-width: 340px; line-height: 1.6;
  }
</style>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>

<div class="hud"><span id="revived">0</span> / <span id="total">0</span> revived</div>

<div class="msg">
  <p id="msg-line">page not found — and the garden took it hard.</p>
  <p id="msg-hint">brush the cursor over a flower to water it back.</p>
  <p><a href="index.html">take me home &rarr;</a></p>
</div>

<div class="caption">what this is — a 404 study. the wilted garden revives under your cursor; revive everything and the weather turns.</div>

<canvas id="trail" aria-hidden="true"
  style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></canvas>

<script src="core/pixel-core.js"></script>
<script src="core/sprites.js"></script>
<script>
"use strict";
PG.labChrome({ title: "404 — wilted garden", n: "03" });

const reduced = PG.reducedMotion;
const scene = document.getElementById("scene");
const revivedEl = document.getElementById("revived");
const totalEl = document.getElementById("total");
const lineEl = document.getElementById("msg-line");
const hintEl = document.getElementById("msg-hint");

/* wilt mapping: keep luminance, drop the hue into grey-brown */
function wilt(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const l = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  const lo = [54, 48, 41], hi = [188, 178, 160];
  const m = (i) => Math.round(lo[i] + (hi[i] - lo[i]) * l);
  return "rgb(" + m(0) + "," + m(1) + "," + m(2) + ")";
}

let ctx = null, w = 0, h = 0;
let skyWilted = null, skyWarm = null, greyLayer = null;
let flowers = [], clouds = [], growers = [], greyGrowers = [];
let textGrower = null, fourText = null;
let total = 0, revivedCount = 0, allRevived = false;
let firstBuild = true;

const BLOBS = [
  { cx: 0.30, cy: 0.28, rx: 0.20, ry: 0.24, s: 1.0 },
  { cx: 0.58, cy: 0.48, rx: 0.22, ry: 0.20, s: 0.8 },
  { cx: 0.82, cy: 0.30, rx: 0.16, ry: 0.24, s: 0.9 },
  { cx: 0.12, cy: 0.55, rx: 0.14, ry: 0.16, s: 0.7 },
];

function buildSky(warm) {
  return PG.offscreen(w, h, (c) => {
    const ht = PG.halftone(w, h, {
      bg: warm ? "#f6ead6" : "#eae4d7",
      dot: warm ? "#ecc89d" : "#c9bfac",
      blobs: BLOBS,
    });
    c.drawImage(ht, 0, 0, w, h);
    const meadowY = PG.snap(h - 104);
    const groundY = h - 18;
    c.fillStyle = warm ? "#a2cd87" : "#b5ac99";
    for (let y = meadowY; y < groundY; y += PG.GRID)
      for (let x = 0; x < w; x += PG.GRID) c.fillRect(x, y, PG.PX, PG.PX);
    const rand = PG.rng("smd-404-meadow");
    c.fillStyle = warm ? "#8bb96e" : "#a59c89";
    for (let y = meadowY; y < groundY; y += PG.GRID)
      for (let x = 0; x < w; x += PG.GRID)
        if (rand() < 0.12) c.fillRect(x, y, PG.PX, PG.PX);
    c.fillStyle = warm ? "#2f7d4f" : "#6e6557";
    c.fillRect(0, groundY, w, h - groundY);
  });
}

function rebuildGreyLayer() {
  greyLayer = PG.offscreen(w, h, (c) => {
    for (const f of flowers) {
      if (f.revived) continue;
      for (const cell of f.greyCells) {
        c.fillStyle = cell.color;
        c.fillRect(cell.x, cell.y, cell.size, cell.size);
      }
    }
  });
}

function buildText() {
  const scale = w < 900 ? 6 : 8;
  const tw = PG.textWidth("404", scale);
  const tx = PG.snap((w - tw) / 2);
  const ty = PG.snap(h * 0.40);
  fourText = (color) => PG.textCells("404", tx, ty, { scale, color });
  textGrower = new PG.Grower(fourText(allRevived ? "#e8a020" : "#5d564b"), {
    bornAt: performance.now() + (firstBuild ? 350 : 0),
    duration: firstBuild ? 1300 : 250,
  });
}

function build() {
  const fit = PG.fitCanvas(scene);
  ctx = fit.ctx; w = fit.w; h = fit.h;
  const groundY = h - 18;
  total = Math.max(8, Math.min(17, Math.floor(w / 96)));
  const prev = flowers;
  flowers = [];
  for (let i = 0; i < total; i++) {
    const rand = PG.rng("smd-404-flower-" + i);
    const slot = w / total;
    const x = PG.snap(slot * i + slot * (0.22 + rand() * 0.56));
    const sprite = PG.FLOWER_LIST[Math.floor(rand() * PG.FLOWER_LIST.length)];
    const scale = 1.2 + rand() * 0.7;
    const hp = sprite.rows.length * PG.GRID * scale;
    flowers.push({
      x,
      top: groundY - hp,
      bottom: groundY,
      cells: PG.spriteCells(sprite, scale, x, groundY),
      greyCells: PG.spriteCells(PG.recolor(sprite, wilt), scale, x, groundY),
      revived: prev[i] ? prev[i].revived : false,
    });
  }
  const now = performance.now();
  growers = [];
  flowers.forEach((f) => {
    if (f.revived) growers.push(new PG.Grower(f.cells, { bornAt: now, duration: 250 }));
  });
  greyGrowers = [];
  if (firstBuild) {
    flowers.forEach((f, i) => {
      greyGrowers.push({
        idx: i,
        grower: new PG.Grower(f.greyCells, {
          bornAt: now + 200 + i * 70, duration: 700, flicker: false,
        }),
      });
    });
    greyLayer = PG.offscreen(w, h, () => {});
  } else {
    rebuildGreyLayer();
  }
  skyWilted = buildSky(false);
  skyWarm = buildSky(true);
  clouds = PG.makeClouds(w, h * 0.5, [
    { baseX: 0.12, y: 0.20, rx: 0.17, ry: 0.11, speed: 4.0, alpha: 0.50 },
    { baseX: 0.55, y: 0.46, rx: 0.13, ry: 0.09, speed: 6.5, alpha: 0.40 },
    { baseX: 0.80, y: 0.12, rx: 0.19, ry: 0.12, speed: 3.2, alpha: 0.50 },
  ]);
  buildText();
  totalEl.textContent = total;
  window.__flowerAnchors = flowers.map((f) => ({
    x: f.x, y: Math.round((f.top + f.bottom) / 2),
  }));
  firstBuild = false;
}

function reviveAt(mx, my) {
  for (let i = 0; i < flowers.length; i++) {
    const f = flowers[i];
    if (f.revived) continue;
    const py = Math.max(f.top, Math.min(f.bottom, my));
    if (Math.hypot(mx - f.x, my - py) > 50) continue;
    f.revived = true;
    revivedCount++;
    growers.push(new PG.Grower(f.cells, { duration: 850 }));
    greyGrowers = greyGrowers.filter((g) => g.idx !== i);
    if (greyGrowers.length === 0) rebuildGreyLayer();
    revivedEl.textContent = revivedCount;
    if (revivedCount >= total && !allRevived) {
      allRevived = true;
      textGrower = new PG.Grower(fourText("#e8a020"), { duration: 1100 });
      lineEl.textContent = "every flower is back. nice watering.";
      hintEl.textContent = "the page is still missing, though.";
    }
  }
}
window.addEventListener("mousemove", (e) => reviveAt(e.clientX, e.clientY));

function frame(t) {
  if (scene.offsetWidth !== w || scene.offsetHeight !== h) {
    if (scene.offsetWidth < 10) { requestAnimationFrame(frame); return; }
    build();
  }
  ctx.drawImage(allRevived ? skyWarm : skyWilted, 0, 0, w, h);
  PG.drawClouds(ctx, clouds, w, reduced ? 0 : t,
    allRevived ? ["#ffffff", "#f0e6d2"] : ["#ded8cb", "#cfc8b9"]);
  ctx.drawImage(greyLayer, 0, 0, w, h);
  if (greyGrowers.length) {
    let allDone = true;
    for (const g of greyGrowers) if (!g.grower.draw(ctx, t)) allDone = false;
    if (allDone) { greyGrowers = []; rebuildGreyLayer(); }
  }
  for (const g of growers) g.draw(ctx, t);
  if (textGrower) textGrower.draw(ctx, t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

PG.attachTrail(document.getElementById("trail"));
</script>
</body>
</html>
