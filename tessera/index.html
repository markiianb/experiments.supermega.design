<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="supermega-instrument-release" content="0.1.0-4b3001d2c6ef" />
<title>SUPERMEGA — Tessera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' fill='%23f61515'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="../_kit/releases/0.1.0-4b3001d2c6ef/instrument.css" />
<link rel="stylesheet" href="../_system/experiment-host.css" />
<style>
  /* The surface starts BELOW the fixed chrome. The selector carries
     body[data-system] because the host sheet pins inset:0 at that specificity. */
  .stage{position:fixed;inset:0;overflow:hidden;background:#111;touch-action:none}
  body[data-system="instrument"] .stage.instrument-renderer-surface{inset-block-start:var(--instrument-chrome-height)}
  body[data-system="instrument"][data-instrument-embed="true"] .stage.instrument-renderer-surface{inset-block-start:0}
  @media (max-width: 767px){
    body[data-system="instrument"][data-controls="visible"] .stage.instrument-renderer-surface{inset-inline-end:0}
  }
  .stage canvas{display:block;cursor:crosshair}
  /* Dropping a picture: the stage says so. */
  .stage[data-drop="over"]{outline:2px dashed #f61515;outline-offset:-10px}
  /* The first thing on the stage: where your picture goes. Page-owned, not a kit control. */
  .tessera-drop{position:absolute;inset-inline:0;inset-block-start:50%;transform:translateY(-50%);margin-inline:auto;inline-size:min(440px,calc(100% - 32px));z-index:3;display:grid;gap:6px;justify-items:center;padding:22px 20px;border:2px dashed rgba(255,255,255,.55);background:rgba(10,10,10,.82);color:#fff;font:600 15px/1.3 var(--instrument-font-sans, system-ui, sans-serif);text-align:center;cursor:pointer;backdrop-filter:blur(4px)}
  .tessera-drop:hover,.stage[data-drop="over"] .tessera-drop{border-color:#f61515}
  .tessera-drop small{font:500 11px/1.3 var(--instrument-font-mono, ui-monospace, monospace);letter-spacing:.04em;opacity:.7;text-transform:uppercase}
  .stage[data-has-image="true"] .tessera-drop{display:none}
  body[data-instrument-embed="true"] .tessera-drop{display:none}
  .tessera-file{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
  .tessera-credit{position:absolute;inset-inline-end:16px;inset-block-end:14px;text-align:end;font:500 11px/1.3 var(--instrument-font-mono, ui-monospace, monospace);letter-spacing:.04em;color:#fff;mix-blend-mode:difference;opacity:.7;z-index:2}
  .tessera-credit a{color:inherit}
  body[data-instrument-embed="true"] .tessera-credit{display:none}
</style>
</head>
<body data-system="instrument" data-instrument-release="0.1.0-4b3001d2c6ef" data-instrument-polarity="ink" data-instrument-grid="off" data-instrument-grain="off" data-instrument-density="normal" data-instrument-motion="system" data-controls="visible">
  <script>if(new URLSearchParams(location.search).get('instrument-embed')==='1')document.body.dataset.instrumentEmbed='true';</script>

  <section class="stage instrument-renderer-surface" id="stage">
    <canvas id="c" aria-label="Tessera: a picture rebuilt as a grid of marks — bars, squares, rings, dots and checkers — one mark and one colour per tone. Drop or paste a picture to use your own."></canvas>
    <button type="button" class="tessera-drop" id="drop"><span>Drop a picture here — or click to choose one</span><small>JPG · PNG · WEBP · or paste · it becomes the field of marks</small></button>
    <div class="tessera-credit">After the Base image treatment — <a href="https://mouthwash.studio/project/base/" target="_blank" rel="noreferrer">Mouthwash Studio</a>, tool by <a href="https://johnprovencher.com/" target="_blank" rel="noreferrer">John Provencher</a>, after Karel Martens · <a href="seed-prompt.txt">seed prompt</a></div>
  </section>

  <header class="instrument-renderer-chrome">
    <div class="instrument-renderer-chrome-zone experiment-brand"><span class="experiment-brand-mark" aria-hidden="true"></span><a data-crumb="root" href="https://supermega.design">SUPERMEGA</a><span class="experiment-brand-sep" aria-hidden="true">/</span><a href="../">EXPERIMENTS</a><span class="experiment-brand-sep" aria-hidden="true">/</span><span class="experiment-brand-here">TESSERA</span></div>
    <div class="instrument-renderer-chrome-zone instrument-renderer-chrome-zone--middle"><span>Your picture in lines and cubes — the Base image treatment. Drop, paste or upload an image.</span></div>
    <div class="instrument-renderer-chrome-zone instrument-renderer-chrome-zone--end"><span class="instrument-renderer-meta">EX-TESS-01</span><button type="button" class="instrument-action" id="b-image" title="Use your own picture — or drop / paste one onto the stage">Upload</button><button type="button" class="instrument-action" id="b-defaults" title="Restore configuration defaults — Base's own settings">Defaults</button><button class="instrument-action" id="toggle" type="button">Controls</button></div>
  </header>
  <input class="tessera-file" id="file" type="file" accept="image/*" aria-label="Choose a picture" />

  <aside class="instrument-renderer-panel" id="panel" aria-label="Tessera controls"></aside>

  <div class="instrument-material-grid" aria-hidden="true"></div><div class="instrument-material-grain" aria-hidden="true"></div>

<script src="../_kit/releases/0.1.0-4b3001d2c6ef/instrument-runtime.js"></script>
<script src="../_system/adapters/adapter-core.js"></script>
<script src="../_system/adapters/tessera.js"></script>
<script src="../_system/shell/panel.js"></script>
<script src="../_system/shell/applicability.js"></script>
<script src="../_system/shell/state.js"></script>
<script src="../_system/shell/export.js"></script>
<script src="../_system/shell/video.js"></script>
<script src="../_system/shell/viewport.js"></script>
<script src="../_system/shell/timeline.js"></script>
<script src="../_system/shell/tool.js"></script>
<script src="tessera-core.js"></script>

<script>
/* =============================================================================
   Tessera — page glue.

   Four controls (style, detail, contrast, balance) plus a frame. The engine
   turns them into the full look (E.resolve). The picture is canvas-owned
   media: drop, paste, or the Upload button; one built-in picture until then.
   ========================================================================== */
(() => {
  const A = window.SUPERMEGA_INSTRUMENT_ADAPTERS.tessera;
  const E = window.SUPERMEGA_TESSERA;
  const shell = window.SUPERMEGA_INSTRUMENT_SHELL;
  const canvas = document.getElementById('c');
  const stage = document.getElementById('stage');
  const UPLOAD_KEY = 'tessera:upload:v1';

  let sayStatus = null;
  let viewport = null;
  let uploadName = null;
  let current = null;
  let shown = null; // the configuration being drawn — adapter-core commits after the callback
  let picture = { cutout: false };
  // A picture with a transparent border is a cut-out: sample its corners and edges.
  const isCutout = (img) => {
    try {
      const c = document.createElement('canvas'); c.width = 64; c.height = 64;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, 64, 64);
      const d = g.getImageData(0, 0, 64, 64).data;
      let clear = 0, n = 0;
      for (let i = 0; i < 64; i += 1) for (const [x, y] of [[i, 0], [i, 63], [0, i], [63, i]]) { n += 1; if (d[(y * 64 + x) * 4 + 3] < 128) clear += 1; }
      return clear / n > 0.5;
    } catch (e) { return false; }
  };
  const engine = E.createEngine(canvas, { onFrame: () => { if (sayStatus) sayStatus(); } });

  const setPicture = (img, key) => {
    current = { img, key };
    picture = { cutout: isCutout(img) };
    engine.setConfig(E.resolve(shown || adapter.getConfiguration(), picture));
    engine.setSource(img, key);
    if (viewport) { viewport.refresh('source'); viewport.fit(); }
  };
  // The built-in picture: a letter on paper, portrait like most photos.
  const sample = (() => {
    const c = document.createElement('canvas'); c.width = 1200; c.height = 1500;
    const g = c.getContext('2d'); g.fillStyle = '#f2f0ea'; g.fillRect(0, 0, 1200, 1500);
    g.drawImage(E.drawSample('letter', 1200), 0, 150);
    return c;
  })();

  const schema = A.schema;
  const adapter = A.create({
    applyConfiguration: (c) => {
      shown = c;
      const look = E.resolve(c, picture);
      stage.style.background = look.background;
      engine.setConfig(look);
      if (viewport) viewport.refresh('canvas.aspect');
    },
    createArtifact: (request) => {
      const edge = request && Number.isFinite(request.longEdge) ? request.longEdge : 4096;
      const out = engine.exportPNG(edge, 0);
      const c = adapter.getConfiguration();
      return { ...out, filename: `tessera-${c.style}-${out.width}.png`, mime: 'image/png' };
    },
    hideControls: () => controller.setControls(false),
    nextVariant: () => {
      const others = A.styles.filter((s) => s !== adapter.getConfiguration().style);
      return { style: others[Math.floor(Math.random() * others.length)] };
    },
    showControls: () => controller.setControls(true),
  });

    setPicture(sample, 'sample:letter');

  const page = {
    bounds: () => engine.artifactSize(Math.max(schema.canvas.width, schema.canvas.height)),
    renderFrame: (ctx, width, height) => engine.renderTo(ctx.canvas, width, height, 0),
    resize: (width, height) => engine.resizeTo(width, height),
  };
  const tool = shell.mountTool({
    adapter, canvas, defaults: () => A.defaults, normalize: A.normalize, page,
    panel: document.getElementById('panel'), schema: A.schema, stage,
  });
  const controller = tool.controller;
  viewport = tool.viewport;

  let said = '';
  sayStatus = () => {
    const c = shown || adapter.getConfiguration();
    const s = engine.getState();
    const line = uploadName ? `${c.style.toUpperCase()} · ${s.cols}×${s.rows}` : `${c.style.toUpperCase()} · DROP A PICTURE`;
    if (line === said) return;
    said = line;
    controller.status(line, 'active');
  };

  document.getElementById('b-defaults').addEventListener('click', () => adapter.execute('reset-configuration'));

  /* ---------- your picture: choose, drop or paste ---------- */
  const useImage = (img, name, store) => {
    uploadName = name || 'image';
    stage.dataset.hasImage = 'true';
    setPicture(img, `upload:${uploadName}:${img.naturalWidth}x${img.naturalHeight}`);
    if (store) { try { localStorage.setItem(UPLOAD_KEY, JSON.stringify({ name: uploadName, data: E.keepable(img, 1600) })); } catch (e) { /* the picture still works this session */ } }
    said = ''; sayStatus();
  };
  const loadFile = (file) => {
    if (!file || !/^image\//.test(file.type)) { controller.status('THAT IS NOT A PICTURE — TRY A JPG, PNG OR WEBP', 'alert'); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { useImage(img, file.name, true); URL.revokeObjectURL(url); };
    img.onerror = () => { controller.status('THE PICTURE COULD NOT BE READ', 'alert'); URL.revokeObjectURL(url); };
    img.src = url;
  };
  const input = document.getElementById('file');
  document.getElementById('b-image').addEventListener('click', () => input.click());
  document.getElementById('drop').addEventListener('click', () => input.click());
  input.addEventListener('change', () => { loadFile(input.files && input.files[0]); input.value = ''; });
  stage.addEventListener('dragover', (e) => { e.preventDefault(); stage.dataset.drop = 'over'; });
  stage.addEventListener('dragleave', () => { delete stage.dataset.drop; });
  stage.addEventListener('drop', (e) => { e.preventDefault(); delete stage.dataset.drop; loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); });
  window.addEventListener('paste', (e) => {
    const item = [...((e.clipboardData && e.clipboardData.items) || [])].find((i) => i.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });
  if (new URLSearchParams(location.search).get('reset-state') === '1') { try { localStorage.removeItem(UPLOAD_KEY); } catch (e) {} } else {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(UPLOAD_KEY) || 'null'); } catch (e) { saved = null; }
    if (saved && saved.data) { const img = new Image(); img.onload = () => useImage(img, saved.name, false); img.src = saved.data; }
  }

  /* ---------- boot ---------- */
  const instrumentState = window.SUPERMEGA_INSTRUMENT.createState();
  instrumentState.appearance.grain = false;
  instrumentState.shell.overviewVisible = false;
  window.TESSERA_MATERIALS = window.SUPERMEGA_INSTRUMENT.enhance(document.body, instrumentState);
  window.TESSERA_ADAPTER = adapter;
  window.TESSERA_ENGINE = engine;
  window.TESSERA_SHELL = { controller, viewport };
  window.TESSERA_USE_IMAGE = useImage;
  if (window.parent !== window) window.TESSERA_BRIDGE = window.SUPERMEGA_INSTRUMENT_ADAPTERS.core.installBridge(adapter);

  /* ---------- fidelity: the Base style against base.org's shader ----------
     The widest bar at the Base style is 0.66 of a cell (scale .66, top tier). */
  window.SHELL_FIDELITY = [{
    name: 'base: widest bar as a share of the cell (scale 0.66)',
    reference: 0.66,
    tolerance: 0.03,
    measure: () => {
      const before = adapter.getConfiguration();
      const was = current;
      engine.setSource(E.drawSample('portal', 1200), 'sample:portal');
      adapter.configure({ aspect: '1:1', balance: 0, contrast: 1, detail: 40 / E.STYLES.base.columns, style: 'base' });
      const off = document.createElement('canvas'); off.width = 2000; off.height = 2000;
      engine.renderTo(off, 2000, 2000, 0);
      adapter.configure(before);
      engine.setSource(was.img, was.key);
      const g = off.getContext('2d');
      let widest = 0;
      for (let y = 50; y < 1950; y += 11) {
        const row = g.getImageData(0, y, 2000, 1).data;
        let run = 0;
        for (let x = 0; x < 2000; x += 1) {
          const ink = (765 - row[x * 4] - row[x * 4 + 1] - row[x * 4 + 2]) / 3 > 85;
          run = ink ? run + 1 : 0;
          if (run > widest && run < 50) widest = run;
        }
      }
      return widest / 50;
    },
  }];

  viewport.fit();
  engine.start();
  sayStatus();
  window.TESSERA_READY = true;
})();
</script>
</body>
</html>
